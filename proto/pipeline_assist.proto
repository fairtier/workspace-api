syntax = "proto3";

package pipeline_assist.v1;

option go_package = "github.com/fairtier/workspace-api/proto/pipeline_assist/v1;pipelineassistv1";

import "pipeline.proto";

// PipelineAssistService drafts pipeline configurations from a natural-language
// description using an LLM. It is a single-shot request/response RPC that runs
// server-side in the FairTier API (no source-system access needed for
// drafting).
//
// The draft fills source_config only — never source_credentials — so secrets
// are never generated by the model; the user supplies them. The result is a
// pre-filled, pre-validated CreatePipeline request the user reviews and edits
// before submitting, converging on the same validator + error surface as the
// manual CreatePipeline path.
//
// Requires JWT auth (available on the public port only).
service PipelineAssistService {
  // DraftPipeline turns a natural-language prompt into a draft pipeline
  // configuration. Returns INVALID_ARGUMENT (with ValidationErrors details)
  // when the drafted source_config fails schema validation, and UNIMPLEMENTED
  // when AI drafting is not configured on the server.
  rpc DraftPipeline(DraftPipelineRequest) returns (DraftPipelineResponse) {}
}

message DraftPipelineRequest {
  // Natural-language description of the data the user wants to ingest, e.g.
  // "Load my Stripe charges and customers daily into a stripe dataset".
  string prompt = 1;
}

message DraftPipelineResponse {
  // The drafted pipeline request, pre-filled and validated. Its
  // source_credentials field is always empty — the model never drafts secrets.
  pipeline.v1.CreatePipelineRequest draft = 1;
  // Short human-readable explanation of the draft and any assumptions made,
  // surfaced to the user above the pre-filled form.
  string notes = 2;
}
