name: Release

on:
  push:
    tags: ["v*"]
  # Re-run a release for a tag that is already pushed. A tag push that lands
  # while Actions is down creates no run at all — nothing queues, so there is
  # nothing to retry once it recovers. Run it from the tag ref
  # (`gh workflow run Release --ref v1.2.3`); the metadata step reads the image
  # tags off that ref, so it produces the same image either way.
  #
  # It only works for tags cut after this line, because the dispatch is checked
  # against the trigger present *on the requested ref*. For an older tag the
  # recovery is to delete and re-push it — safe only while it points at the
  # same commit, since the Go module proxy has already recorded that tag's
  # content hash and will keep serving the original one.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # The Dockerfile builds for linux/amd64 only.
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
