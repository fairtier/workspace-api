name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Run CI for a commit that is already pushed. A push that lands while Actions
  # is down creates no run at all — nothing queues, so there is nothing to retry
  # once it recovers, and unlike a tag a branch commit cannot be re-pushed to
  # mint a fresh event. Run it from the branch (`gh workflow run CI --ref
  # master`); a dispatched run covers exactly what a master push covers, since
  # `buf breaking` is skipped on any non-pull-request event either way.
  #
  # It only works for commits after this line, because the dispatch is checked
  # against the trigger present *on the requested ref*. An earlier commit stays
  # unverified until something else lands on master.
  workflow_dispatch:
  # Daily dependency audit. Running govulncheck on push and pull_request only
  # answers "did this change introduce a vulnerability?" — but most CVEs arrive
  # the other way round: the advisory lands against a dependency nobody
  # touched, and a repo that is quiet for a month never re-runs the scan. Only
  # `govulncheck` runs on this trigger (see the `if:` on every other job).
  #
  # Two things about GitHub schedules worth knowing before editing this:
  #   - a scheduled run always uses the workflow file on the DEFAULT branch, so
  #     a change here does nothing until it is merged there;
  #   - GitHub disables the schedule after 60 days with no repo activity, and
  #     mails the owner when it does. A quiet repo is exactly the case this job
  #     exists for, so treat that mail as an alert, not as noise.
  schedule:
    - cron: "57 6 * * *"

jobs:
  lint:
    name: Lint
    # A scheduled run exists to re-scan unchanged dependencies against a
    # changed advisory database, so only `govulncheck` below has anything new
    # to say — the other jobs would re-prove the same commit daily.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m

  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -count=1 ./...

  proto:
    name: Proto
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: buf lint
        run: buf lint

      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/${{ github.base_ref }}"

      # The committed stubs must match the .proto sources: regenerate with the
      # plugin versions pinned by go.mod and fail on any diff.
      - name: install protoc plugins at go.mod versions
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@"$(go list -m -f '{{.Version}}' google.golang.org/protobuf)"
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@"$(go list -m -f '{{.Version}}' connectrpc.com/connect)"

      - name: check generated code is up to date
        run: |
          buf generate
          git diff --exit-code -- proto

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: Docker build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
