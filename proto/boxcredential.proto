syntax = "proto3";

package boxcredential.v1;

option go_package = "github.com/fairtier/workspace-api/proto/boxcredential/v1;boxcredentialv1";

// BoxCredentialService is the box's private channel to central: the box
// deposits what only it can mint, and fetches what only central can mint.
// Central never holds box admin credentials.
//
// It used to carry three more deposits — the box's write-scoped Gitea token,
// its rill-snapshot bearer, and its age public key. All three existed for one
// reason: so that CENTRAL could write the box's git repos on the customer's
// behalf. They were retired with the workspace-plane split (Phase 3E), where
// a box serves its own workspace plane and reads those three from its own
// Kubernetes Secrets (workspace.StaticBoxCredentials) instead. A deployment
// holding no box git credential therefore cannot converge a box repo — the
// intended end state, not a degradation.
//
// Internal port (:8081) only. The caller must present a box-issued service
// token (issuer trust binds the tenant slug) — a central Console JWT is
// rejected.
service BoxCredentialService {
  // DepositFederationClient upserts the OAuth client the box minted for
  // itself so its users can sign in through the central identity provider.
  // Central registers the deposited pair as this tenant's client rather than
  // minting one and pushing it down — the secret that ends up in the box's
  // database is then the box's own, and its owner can rotate it by
  // re-depositing. Idempotent: the box seed Job re-deposits on every ArgoCD
  // sync.
  rpc DepositFederationClient(DepositFederationClientRequest) returns (DepositFederationClientResponse) {}

  // FetchBoxSecrets returns the centrally-minted secrets central holds for the
  // calling tenant. The one RPC on this service that runs the other way, and
  // the reason it exists: a box's other channel for a centrally-known secret
  // is cloud-init, which is create-only on the provider and therefore frozen
  // at first boot. Anything delivered that way can never be changed or
  // rotated without replacing the customer's machine. This is the day-2 path.
  //
  // Same trust rules as the deposit — the slug is bound by issuer trust, so a
  // box can only ever read its own secrets. Idempotent and safe to call on a
  // loop: the box sync Job re-reads on every ArgoCD sync, which is what makes
  // a central rotation converge without touching the box.
  rpc FetchBoxSecrets(FetchBoxSecretsRequest) returns (FetchBoxSecretsResponse) {}
}

message DepositFederationClientRequest {
  // OAuth client id the box generated for itself. Not secret.
  string client_id = 1;
  // The matching client secret, generated on the box. Central stores it
  // encrypted and registers it as this tenant's client; it never mints one.
  string client_secret = 2;
  // Optional free-form note (e.g. the minting job / secret name) for audit.
  string note = 3;
}

message DepositFederationClientResponse {}

message FetchBoxSecretsRequest {
  // Keys to read. Empty means "everything central holds for this tenant",
  // which is what the sync Job asks for — the box learns of a new secret by
  // receiving it, so it must not have to be taught the key list first.
  repeated string keys = 1;
}

message FetchBoxSecretsResponse {
  // key → value, for the keys central actually holds. A requested key that is
  // absent is OMITTED rather than an error: the box syncs on a loop and
  // central may not have minted a value yet. Distinguishing "not yet" from
  // "never" is not the box's job, and failing the whole fetch over one
  // missing key would take down the delivery of every other secret.
  map<string, string> secrets = 1;
}
