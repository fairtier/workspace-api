syntax = "proto3";

package assist.v1;

option go_package = "github.com/fairtier/workspace-api/proto/assist/v1;assistv1";

import "transformation.proto";

// AssistService drafts dbt transformations and Rill dashboards from
// natural-language descriptions using an LLM. Like
// pipeline_assist.v1.PipelineAssistService (which may be aliased into this
// service later), every RPC is a single-shot request/response call — no agent
// loop — and the model never drafts credentials of any kind. Drafts are
// always shown to the user for review; nothing is committed automatically.
//
// Returns UNIMPLEMENTED when AI drafting is not configured on the server
// (the Console shows the panels as "Coming soon").
//
// Requires JWT auth (available on the public port only).
service AssistService {
  // DraftTransformation turns a natural-language prompt into a draft dbt
  // transformation: a pre-filled CreateTransformation request (hosted-repo
  // mode) plus starter model files the user reviews and commits themselves.
  rpc DraftTransformation(DraftTransformationRequest) returns (DraftTransformationResponse) {}

  // DraftRillDashboard turns a natural-language prompt into draft Rill
  // project files (metrics views, explore dashboards, optional models),
  // opened as unsaved buffers in the Console's Rill editor.
  rpc DraftRillDashboard(DraftRillDashboardRequest) returns (DraftRillDashboardResponse) {}

  // DraftSql turns a natural-language request into one read-only DuckDB
  // query. The server assembles the schema context from the caller's own
  // warehouse (all table names, column detail for the most relevant few) and
  // validates the draft with EXPLAIN best-effort — a statement the engine
  // rejects still comes back, with the engine's message in notes. The draft
  // is inserted into the editor, NEVER executed automatically.
  rpc DraftSql(DraftSqlRequest) returns (DraftSqlResponse) {}

  // ExplainError explains one failure in plain language. For pipeline and
  // transformation runs the client sends only ids — the server assembles the
  // trusted context from the caller's own rows (config without credentials,
  // run status, the stored error text) so nothing client-supplied poses as
  // trusted data. The SQL target is the exception: the editor's SQL and
  // engine error are client-supplied because the server keeps no query
  // history.
  rpc ExplainError(ExplainErrorRequest) returns (ExplainErrorResponse) {}
}

// DraftFile is one generated file, path relative to the target repo root.
message DraftFile {
  string path = 1;
  string content = 2;
}

message DraftTransformationRequest {
  // Natural-language description, e.g. "Build a daily revenue mart from the
  // stripe charges table".
  string prompt = 1;
}

message DraftTransformationResponse {
  // Pre-filled, validated create request. repo_url and git_credentials are
  // always empty (hosted-repo mode) — the model never drafts repos or
  // secrets — and trigger_after_pipeline_id is left for the user (the model
  // cannot know pipeline IDs).
  transformation.v1.CreateTransformationRequest draft = 1;
  // Starter dbt files for the hosted repo (models/**.sql + schema.yml),
  // rendered read-only for review; the user commits them via the box repo
  // editor or copy-paste.
  repeated DraftFile files = 2;
  // Short human-readable explanation of the draft and any assumptions made.
  string notes = 3;
}

message DraftRillDashboardRequest {
  string prompt = 1;
  // Existing Rill repo paths, sent by the Console so the model references
  // real models/sources instead of inventing them.
  repeated string existing_paths = 2;
}

message DraftRillDashboardResponse {
  // Drafted files (metrics/<name>.yaml, dashboards/<name>.yaml, optional
  // models/<name>.sql), YAML-validated server-side.
  repeated DraftFile files = 1;
  string notes = 2;
}

message DraftSqlRequest {
  // Natural-language request, e.g. "revenue by month for the last year".
  string prompt = 1;
  // The editor's current SQL, for requests that refer to it ("add a filter
  // to this"). Optional.
  string current_sql = 2;
}

message DraftSqlResponse {
  // One DuckDB SELECT statement. Never executed server-side. Empty when
  // no_relevant_data is set.
  string sql = 1;
  // Explanation, assumptions, and (when EXPLAIN failed) the engine's own
  // validation message. When no_relevant_data is set: what the warehouse
  // lacks and what would need to be ingested first.
  string notes = 2;
  // The model's explicit "cannot answer" code: the warehouse holds nothing
  // about the request's subject. The Console renders notes as a standing
  // warning and leaves the editor untouched. Additive — false (the proto3
  // default) means a normal draft, so old clients fall back to their
  // empty-sql handling.
  bool no_relevant_data = 3;
}

message ExplainErrorRequest {
  oneof target {
    PipelineRunTarget pipeline_run = 1;
    TransformationRunTarget transformation_run = 2;
    SqlErrorTarget sql = 3;
  }
}

// PipelineRunTarget names one run of the caller's own pipeline; the run must
// be among the pipeline's recent runs (NOT_FOUND otherwise).
message PipelineRunTarget {
  string pipeline_id = 1;
  string run_id = 2;
}

message TransformationRunTarget {
  string transformation_id = 1;
  string run_id = 2;
}

// SqlErrorTarget carries a failed editor query verbatim.
message SqlErrorTarget {
  string sql = 1;
  string error_message = 2;
}

message ExplainErrorResponse {
  // Plain-language description of what failed.
  string explanation = 1;
  // The single most likely root cause.
  string likely_cause = 2;
  // What to do next, concretely.
  string suggested_fix = 3;
  // A corrected SQL/config fragment when the model is confident; often empty.
  // Rendered read-only — applying it is always the user's explicit action.
  string suggested_snippet = 4;
}
